name: wf-ci
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS files
        run: npx stylelint "**/*.css"
      - name: Repo Information
        run: |
          git branch
          echo "Actor Name: ${{github.actor}}"
          echo "Repo Name: ${{github.repository}}"
          echo "Event Name: ${{github.event_name}}"
        